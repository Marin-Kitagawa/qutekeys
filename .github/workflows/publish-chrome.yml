name: Release Chrome

# Builds the Chrome target and attaches the packaged zip to a GitHub release.
# Users download the zip and load it unpacked via chrome://extensions
# (Developer mode → Load unpacked).
#
# Triggers: version tags (v*) and manual runs. On manual runs the version
# comes from dist/chrome/manifest.json.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome target
        run: npx rimraf dist && npm run build:chrome

      - name: Determine version
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./dist/chrome/manifest.json').version")
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building version ${VERSION}"

      - name: Sync manifest version
        run: |
          node -e "
            const fs = require('fs');
            const file = 'dist/chrome/manifest.json';
            const m = JSON.parse(fs.readFileSync(file, 'utf8'));
            m.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(m, null, 2) + '\n');
          "

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('dist/chrome/manifest.json','utf8')); console.log('manifest.json is valid JSON')"

      - name: Package zip
        run: |
          cd dist/chrome
          zip -r -q "../../qutesurf-chrome-v${VERSION}.zip" .
          cd ../..
          ls -la "qutesurf-chrome-v${VERSION}.zip"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: qutesurf-chrome-v*.zip
          generate_release_notes: true

      # Manual runs without a tag: keep the zip as a workflow artifact
      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: qutesurf-chrome-v${{ env.VERSION }}
          path: qutesurf-chrome-v*.zip
          retention-days: 30
