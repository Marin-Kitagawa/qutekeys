<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QuteSurf Markdown Preview</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0 auto;
      padding: 32px 20px 80px;
      max-width: 860px;
      background: #17171d;
      color: #e8e8ef;
      font: 15px/1.65 'Hanken Grotesk', system-ui, sans-serif;
    }
    h1, h2, h3, h4, h5, h6 { color: #c9b8ff; line-height: 1.3; margin: 1.4em 0 0.5em; }
    h1 { font-size: 1.9em; } h2 { font-size: 1.5em; } h3 { font-size: 1.25em; }
    a { color: #a78bfa; }
    code {
      background: rgba(124, 92, 255, 0.14);
      border: 1px solid rgba(124, 92, 255, 0.25);
      border-radius: 5px;
      padding: 1px 5px;
      font: 0.9em 'Fira Code', monospace;
    }
    pre {
      background: #101016;
      border: 1px solid rgba(124, 92, 255, 0.25);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
    }
    pre code { background: none; border: none; padding: 0; }
    blockquote {
      margin: 1em 0;
      padding: 4px 16px;
      border-left: 3px solid #7c5cff;
      background: rgba(124, 92, 255, 0.08);
      border-radius: 0 8px 8px 0;
    }
    hr { border: none; border-top: 1px solid rgba(124, 92, 255, 0.35); margin: 2em 0; }
    #empty { color: #8d87a8; text-align: center; margin-top: 120px; }
  </style>
</head>
<body>
  <div id="empty">No preview content — use <code>:preview-markdown</code> with a selection or clipboard text.</div>
  <div id="content"></div>
  <script src="markdown-page.js"></script>
</body>
</html>
