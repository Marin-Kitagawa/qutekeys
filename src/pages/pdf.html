<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QuteSurf PDF Viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #17171d;
      color: #e8e8ef;
      font: 13px/1.45 'Hanken Grotesk', system-ui, sans-serif;
    }
    #toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: rgba(23, 23, 29, 0.92);
      border-bottom: 1px solid rgba(124, 92, 255, 0.35);
      z-index: 10;
    }
    #toolbar button {
      background: rgba(124, 92, 255, 0.18);
      color: #e8e8ef;
      border: 1px solid rgba(124, 92, 255, 0.4);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      font: inherit;
    }
    #toolbar button:hover { background: rgba(124, 92, 255, 0.34); }
    #pageinfo { min-width: 90px; text-align: center; color: #b9b3d8; }
    #title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b9b3d8; }
    #viewer {
      padding: 54px 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #viewer canvas {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      max-width: 94vw;
      height: auto;
    }
    #error { padding: 60px 24px; color: #f08c8c; text-align: center; }
    .page-num {
      position: absolute;
      right: 24px;
      padding: 2px 10px;
      border-radius: 10px;
      background: rgba(124, 92, 255, 0.75);
      font-size: 11px;
    }
    .page-wrap { position: relative; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="prev" title="Previous page (K)">◀</button>
    <span id="pageinfo">– / –</span>
    <button id="next" title="Next page (J)">▶</button>
    <button id="zoomout" title="Zoom out (-)">−</button>
    <button id="zoomin" title="Zoom in (+)">＋</button>
    <button id="zoomfit" title="Reset zoom (0)">100%</button>
    <span id="title"></span>
  </div>
  <div id="viewer"></div>
  <div id="error" hidden></div>
  <script type="module" src="pdf.js"></script>
</body>
</html>
